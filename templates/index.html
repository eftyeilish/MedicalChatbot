<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        function showLoader() {
            document.getElementById("loader").style.display = "block";
            document.getElementById("submitBtn").disabled = true;
        }
    </script>
</head>
<body>

<div class="container">
    <h1>🩺 Medical Chatbot</h1>
    <p class="subtitle">Ask questions based on medical documents</p>

    <form method="POST" onsubmit="showLoader()">
        <textarea name="question" placeholder="Ask a medical question..." required></textarea>
        <button id="submitBtn" type="submit">Ask</button>
    </form>

    <!-- Loading Spinner -->
    <div id="loader" class="loader" style="display:none;"></div>

    {% if answer %}
    <div class="response">
        <h3>Answer</h3>
        <p>{{ answer }}</p>
    </div>
    {% endif %}

    <p class="disclaimer">
        ⚠️ Educational purpose only. Not medical advice.
    </p>
</div>

</body>
</html>
